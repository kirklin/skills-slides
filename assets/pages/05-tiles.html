<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="slide tiles" data-tone="serious">
  <header class="head">
    <p class="eyebrow">数字方块</p>
    <h1 class="headline">六项指标中有一项需要关注。</h1>
    <p class="body">指标三的数量明显高于上季度。</p>
  </header>
  <div class="content">
    <div class="card"><p class="label">指标一</p><p class="big">1,280<small>个</small></p><p class="note">指标一的说明</p></div>
    <div class="card"><p class="label">指标二</p><p class="big">96%</p><p class="note">指标二的说明</p></div>
    <div class="card"><p class="label">指标三</p><p class="big">12<small>项</small></p><p class="note">指标三的说明</p></div>
    <div class="card"><p class="label">指标四</p><p class="big">4.5 万<small>人</small></p><p class="note">指标四的说明</p></div>
    <div class="card"><p class="label">指标五</p><p class="big">32<small>个</small></p><p class="note">指标五的说明</p></div>
    <div class="card"><p class="label">指标六</p><p class="big">56<small>次</small></p><p class="note">指标六的说明</p></div>
  </div>
  <footer class="foot">统计口径：口径说明</footer>
</main>
</body>
</html>
