<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="slide columns">
  <header class="head">
    <p class="eyebrow">柱状图</p>
    <h1 class="headline">8月的数值为年内最高。</h1>
    <p class="body">8月为 120，比 7月增加 32。</p>
  </header>
  <div class="content">
    <div class="legend">
      <span><i class="s4"></i>往期</span>
      <span><i class="s1"></i>本期</span>
    </div>
    <div class="plot">
      <div class="col s4"><b>42</b><i style="height: 29.8%"></i></div>
      <div class="col s4"><b>55</b><i style="height: 39%"></i></div>
      <div class="col s4"><b>48</b><i style="height: 34%"></i></div>
      <div class="col s4"><b>63</b><i style="height: 44.6%"></i></div>
      <div class="col s4"><b>70</b><i style="height: 49.6%"></i></div>
      <div class="col s4"><b>66</b><i style="height: 46.8%"></i></div>
      <div class="col s4"><b>88</b><i style="height: 62.3%"></i></div>
      <div class="col s1"><b>120</b><i style="height: 85%"></i></div>
    </div>
    <div class="axis">
      <span>1月</span><span>2月</span><span>3月</span><span>4月</span><span>5月</span><span>6月</span><span>7月</span><span>8月</span>
    </div>
  </div>
  <footer class="foot">单位：单位名称</footer>
</main>
</body>
</html>
