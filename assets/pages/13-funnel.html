<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="slide funnel">
  <header class="head">
    <p class="eyebrow">漏斗</p>
    <h1 class="headline">流失最多的是第三步。</h1>
    <p class="body">第三步的转化率为 50%，低于其他步骤。</p>
  </header>
  <div class="content">
    <div class="stage"><span class="name">第一步<small>阶段名称</small></span><b class="bar" style="width: 100%">10,000</b><span class="rate">100%<small>起点</small></span></div>
    <div class="stage"><span class="name">第二步<small>阶段名称</small></span><b class="bar" style="width: 62%">6,200</b><span class="rate">62%<small>转化率</small></span></div>
    <div class="stage"><span class="name">第三步<small>阶段名称</small></span><b class="bar" style="width: 31%">3,100</b><span class="rate">50%<small>转化率</small></span></div>
    <div class="stage"><span class="name">第四步<small>阶段名称</small></span><b class="bar" style="width: 22%">2,200</b><span class="rate">71%<small>转化率</small></span></div>
    <div class="stage"><span class="name">第五步<small>阶段名称</small></span><b class="bar" style="width: 15%">1,500</b><span class="rate">68%<small>转化率</small></span></div>
  </div>
</main>
</body>
</html>
