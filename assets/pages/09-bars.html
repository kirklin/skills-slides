<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="slide bars">
  <header class="head">
    <p class="eyebrow">横条</p>
    <h1 class="headline">新方案的投入少一半。</h1>
    <p class="body">除对象三外，各对象的投入都比原方案少一半。</p>
  </header>
  <div class="content">
    <div class="legend">
      <span><i class="s1"></i>新方案</span>
      <span><i class="s4"></i>原方案</span>
    </div>
    <div class="rows">
      <div class="row">
        <div class="name">对象一<small>对象一的说明</small></div>
        <div class="size">4 周<small>原来 8 周</small></div>
        <div class="track">
          <div class="bar s1"><i style="width: 25%"></i><i class="range" style="width: calc(12.5% - 2px)"></i></div>
          <div class="bar s4"><i style="width: 50%"></i><i class="range" style="width: calc(12.5% - 2px)"></i></div>
        </div>
        <div class="value">40 到 60<em>人天</em><small>原来 80 到 100</small></div>
      </div>
      <div class="row">
        <div class="name">对象二<small>对象二的说明</small></div>
        <div class="size">2 周<small>原来 4 周</small></div>
        <div class="track">
          <div class="bar s1"><i style="width: 12.5%"></i><i class="range" style="width: calc(6.25% - 2px)"></i></div>
          <div class="bar s4"><i style="width: 25%"></i><i class="range" style="width: calc(12.5% - 2px)"></i></div>
        </div>
        <div class="value">20 到 30<em>人天</em><small>原来 40 到 60</small></div>
      </div>
      <div class="row">
        <div class="name">对象三<small>对象三的说明</small></div>
        <div class="size">12 周<small>原来 16 周</small></div>
        <div class="track">
          <div class="bar s1"><i style="width: 50%"></i><i class="range" style="width: calc(25% - 2px)"></i></div>
          <div class="bar s4"><i style="width: 75%"></i><i class="range" style="width: calc(25% - 2px)"></i></div>
        </div>
        <div class="value">80 到 120<em>人天</em><small>原来 120 到 160</small></div>
      </div>
      <div class="row">
        <div class="name">对象四<small>对象四的说明</small></div>
        <div class="size">3 周<small>原来 6 周</small></div>
        <div class="track">
          <div class="bar s1"><i style="width: 18.75%"></i><i class="range" style="width: calc(9.38% - 2px)"></i></div>
          <div class="bar s4"><i style="width: 37.5%"></i><i class="range" style="width: calc(12.5% - 2px)"></i></div>
        </div>
        <div class="value">30 到 45<em>人天</em><small>原来 60 到 80</small></div>
      </div>
    </div>
  </div>
  <footer class="foot">比例尺：160 人天对应横条全长；实色为区间下限，浅色为区间上限</footer>
</main>
</body>
</html>
