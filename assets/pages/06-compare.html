<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="slide compare">
  <header class="head">
    <p class="eyebrow">两种做法</p>
    <h1 class="headline">选择做法二，原因有四个。</h1>
    <p class="body">做法二在四个方面都优于做法一。</p>
  </header>
  <div class="content">
    <div class="card">
      <h2><i class="icon warn"></i>做法一的名称</h2>
      <ul class="rows">
        <li><i class="icon warn"></i><div><b>第一个方面</b><small>做法一在这方面的问题</small></div></li>
        <li><i class="icon warn"></i><div><b>第二个方面</b><small>做法一在这方面的问题</small></div></li>
        <li><i class="icon warn"></i><div><b>第三个方面</b><small>做法一在这方面的问题</small></div></li>
        <li><i class="icon warn"></i><div><b>第四个方面</b><small>做法一在这方面的问题</small></div></li>
      </ul>
    </div>
    <div class="card pick">
      <h2>做法二的名称<span class="tag">选用</span></h2>
      <ul class="rows">
        <li><i class="icon ok"></i><div><b>第一个方面</b><small>做法二在这方面的优势</small></div></li>
        <li><i class="icon ok"></i><div><b>第二个方面</b><small>做法二在这方面的优势</small></div></li>
        <li><i class="icon ok"></i><div><b>第三个方面</b><small>做法二在这方面的优势</small></div></li>
        <li><i class="icon ok"></i><div><b>第四个方面</b><small>做法二在这方面的优势</small></div></li>
      </ul>
    </div>
  </div>
</main>
</body>
</html>
