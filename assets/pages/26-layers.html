<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="slide layers">
  <header class="head">
    <p class="eyebrow">结构</p>
    <h1 class="headline">四层结构中，第三层最关键。</h1>
    <p class="body">上面两层都运行在第三层之上。</p>
  </header>
  <div class="content">
    <section class="layer down">
      <div class="group">
        <h2 class="name">第一层</h2>
        <ul class="cells"><li><b>模块一</b></li><li><b>模块二</b></li><li><b>模块三</b></li></ul>
      </div>
    </section>
    <section class="layer">
      <div class="group" style="--span: 3">
        <h2 class="name">第二层的分组一</h2>
        <ul class="cells"><li><b>模块四</b><small>模块四的说明</small></li><li><b>模块五</b></li><li class="more"><b>…</b></li></ul>
      </div>
      <div class="group" style="--span: 2">
        <h2 class="name">第二层的分组二</h2>
        <ul class="cells"><li><b>模块六</b></li><li class="more"><b>…</b></li></ul>
      </div>
    </section>
    <section class="layer pick">
      <div class="group">
        <h2 class="name">第三层</h2>
        <ul class="cells"><li><b>模块七</b></li><li><b>模块八</b></li><li><b>模块九</b></li></ul>
      </div>
    </section>
    <section class="layer">
      <div class="group">
        <h2 class="name">第四层</h2>
        <ul class="cells"><li><b>模块十</b></li><li><b>模块十一</b></li><li><b>模块十二</b></li></ul>
      </div>
    </section>
  </div>
</main>
</body>
</html>
