<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="slide matrix">
  <header class="head">
    <p class="eyebrow">四象限</p>
    <h1 class="headline">先做影响大、投入小的事。</h1>
    <p class="body">事项一和事项二影响大、投入小，安排在本月完成。</p>
  </header>
  <div class="content">
    <p class="axis y">↑ 影响大小</p>
    <div class="quadrants">
      <div class="card pick"><b>影响大、投入小</b><small>立即处理</small><p class="items"><span class="pill">事项一</span><span class="pill">事项二</span></p></div>
      <div class="card"><b>影响大、投入大</b><small>排入计划</small><p class="items"><span class="pill">事项三</span></p></div>
      <div class="card"><b>影响小、投入小</b><small>择机处理</small><p class="items"><span class="pill">事项四</span><span class="pill">事项五</span></p></div>
      <div class="card"><b>影响小、投入大</b><small>暂不处理</small><p class="items"><span class="pill">事项六</span></p></div>
    </div>
    <p class="axis x">投入多少 →</p>
  </div>
</main>
</body>
</html>
