<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="slide tracks" data-tone="parallel">
  <header class="head">
    <p class="eyebrow">双轨</p>
    <h1 class="headline">两件事同时推进。</h1>
    <p class="body">第一件事先完成，第二件事持续时间更长，完成的部分分批上线。</p>
  </header>
  <div class="content">
    <div class="marks">
      <span style="left: 0%">同时开始</span>
      <span class="mid" style="left: 42.2%">关键节点</span>
    </div>
    <div class="guides"><i style="left: 42.2%"></i></div>
    <div class="lane first s1">
      <div class="name"><b>第一件事</b><small>负责团队</small></div>
      <div class="track">
        <i class="bar s1" style="left: 0%; width: 42%">先完成的工作</i>
        <i class="bar wait" style="left: calc(42.4% + 2px); width: 14.8%">观察期</i>
      </div>
      <p class="notes">第一件事的说明</p>
    </div>
    <div class="lane second s2">
      <div class="name"><b>第二件事</b><small>负责团队</small></div>
      <div class="track">
        <i class="bar p1" style="left: 0%; width: 19.3%">第一阶段</i>
        <i class="bar p2" style="left: 19.6%; width: 15.5%">第二阶段</i>
        <i class="bar p3" style="left: 35.4%; width: 46.5%">第三阶段</i>
        <i class="bar p4" style="left: 82.2%; width: 17.8%">继续</i>
        <i class="dot" style="left: 50.6%"></i>
        <i class="dot" style="left: 60.5%"></i>
        <i class="dot" style="left: 70.4%"></i>
        <i class="dot" style="left: 80.2%"></i>
      </div>
      <p class="notes">第二件事的说明<br>白点表示分批上线的部分</p>
    </div>
  </div>
</main>
</body>
</html>
