<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="slide table">
  <header class="head">
    <p class="eyebrow">表格</p>
    <h1 class="headline">五个事项中有一个延期。</h1>
    <p class="body">事项三延期，其余事项按计划进行。</p>
  </header>
  <div class="content">
    <table class="data-table">
      <thead>
        <tr><th>事项</th><th>负责人</th><th class="n">工作量</th><th>状态</th><th>说明</th></tr>
      </thead>
      <tbody>
        <tr><td>事项一</td><td>张三</td><td class="n">12 人天</td><td><span class="tag ok">已完成</span></td><td>事项一的说明</td></tr>
        <tr><td>事项二</td><td>李四</td><td class="n">8 人天</td><td><span class="tag ok">已完成</span></td><td>事项二的说明</td></tr>
        <tr class="pick"><td>事项三</td><td>王五</td><td class="n">20 人天</td><td><span class="tag critical">延期</span></td><td>延期原因和新的完成时间</td></tr>
        <tr><td>事项四</td><td>赵六</td><td class="n">6 人天</td><td><span class="tag">进行中</span></td><td>事项四的说明</td></tr>
        <tr><td>事项五</td><td>钱七</td><td class="n">4 人天</td><td><span class="tag muted">未开始</span></td><td>事项五的说明</td></tr>
      </tbody>
    </table>
  </div>
  <footer class="foot">数据截至：统计日期</footer>
</main>
</body>
</html>
