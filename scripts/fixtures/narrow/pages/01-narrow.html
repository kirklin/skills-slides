<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { --safe-top: 40px; --safe-right: 40px; --safe-bottom: 40px; --safe-left: 40px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; color: #111; }
  .note { position: absolute; left: 60px; top: 60px; font-size: 32px; }
</style>
</head>
<body>
<p class="note">边距只有 40 的风格里，这段文字离左边 60 也在版心以内</p>
</body>
</html>
